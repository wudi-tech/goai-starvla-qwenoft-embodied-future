run_id: candidate_c_from_100k
run_root_dir: /root/autodl-tmp/GOAI/candidate_c
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: '0.21'
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /root/autodl-tmp/GOAI/models/Qwen3-VL-4B-Instruct-ebb281ec
    attn_implementation: sdpa
    vl_hidden_dim: 2048
    enable_gradient_checkpointing: false
  action_model:
    action_model_type: MLP
    action_dim: 14
    action_hidden_dim: 2560
    future_action_window_size: 49
    past_action_window_size: 0
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    state_dim: 14
    action_horizon: 50
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null
      cross_attention_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 50176
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 16
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /root/autodl-tmp/GOAI/datasets_full
    data_mix: robodojo_v21_all_h50_q99
    action_type: abs_qpos
    action_mode: abs
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size:
    - 224
    - 224
    video_backend: torchvision_av
trainer:
  max_train_steps: 100000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 2.0e-06
    qwen_vl_interface: 2.0e-06
    action_model: 2.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: qwen_vl_interface.model
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  pretrained_checkpoint: /root/autodl-tmp/GOAI/models/StarVLA-Qwen3vl4b-OFT-RoboDojo-97123d6/checkpoints/steps_100000_pytorch_model.pt
config_yaml: /root/autodl-tmp/GOAI/candidate_c/config.yaml
output_dir: /root/autodl-tmp/GOAI/candidate_c/candidate_c_from_100k
