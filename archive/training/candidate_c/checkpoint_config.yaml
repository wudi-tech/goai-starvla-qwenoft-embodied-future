datasets:
  vla_data:
    data_mix: robodojo_v21_all_h50_q99
    data_root_dir: /root/autodl-tmp/GOAI/datasets_full
    dataset_py: lerobot_datasets
    obs_image_size:
    - 224
    - 224
    per_device_batch_size: 16
framework:
  action_model:
    action_dim: 14
    action_hidden_dim: 2560
    action_horizon: 50
    action_model_type: MLP
  name: QwenOFT
  qwenvl:
    attn_implementation: sdpa
    base_vlm: /root/autodl-tmp/GOAI/models/Qwen3-VL-4B-Instruct-ebb281ec
    enable_gradient_checkpointing: false
output_dir: /root/autodl-tmp/GOAI/candidate_c/candidate_c_from_100k
run_id: candidate_c_from_100k
run_root_dir: /root/autodl-tmp/GOAI/candidate_c
seed: 42
trainer:
  eval_interval: 500
  freeze_modules: qwen_vl_interface.model
  gradient_clipping: 1.0
  is_resume: false
  learning_rate:
    action_model: 2.0e-05
    base: 2.0e-06
    qwen_vl_interface: 2.0e-06
  logging_frequency: 10
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 100000
  num_warmup_steps: 500
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  pretrained_checkpoint: /root/autodl-tmp/GOAI/models/StarVLA-Qwen3vl4b-OFT-RoboDojo-97123d6/checkpoints/steps_100000_pytorch_model.pt
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
wandb_entity: your_wandb_entity
wandb_project: llavavla
